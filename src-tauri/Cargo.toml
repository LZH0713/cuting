[package]
name = "cuting"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cuting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-vision = "0.3.2"
block2 = "0.6.2"
md-5 = "0.11.0"
tauri-plugin-global-shortcut = "2.4.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
objc2 = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
tauri-plugin-single-instance = "2.5.5"
objc2-web-kit = "0.3.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "charset", "http2", "macos-system-configuration", "socks"] }
sha2 = "0.11.1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
